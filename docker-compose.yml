services:
  db:
    image: pgvector/pgvector:pg17
    container_name: tutor-db
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor
      POSTGRES_DB: tutor
    ports: ["5433:5432"]
    volumes:
      - tutor-pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor"]
      interval: 5s
      retries: 10

volumes:
  tutor-pgdata:
